# Template BRSKT — pipeline de produto: build/test no GitHub, imagem no GHCR, deploy na VPS.
# Copie para .github/workflows/deploy.yml no repositório do produto.
#
# Pré-requisitos (docs/deployment-guide.md, "Configurar o CI de um produto"):
#   - produto registrado em brskt-infra/apps/<produto>/product.yml, com a chave pública
#     do secret BRSKT_DEPLOY_SSH_KEY em deploy_keys
#   - secret do repositório: BRSKT_DEPLOY_SSH_KEY (chave privada de deploy deste produto)
#   - opcional: secret APP_ENV (linhas KEY=VALUE), gravado na VPS antes de cada deploy
#   - operações sem deploy (status, logs, rollback...): templates/github-actions/ops.yml
#   - nada da Tailscale para cadastrar: a credencial OIDC (abaixo, em env) não é segredo e só
#     aceita jobs da branch main de repositórios brskt-dev/* ("Tailscale para o CI" no guia)
#   - deploy/compose.yml seguindo o contrato (templates/api|web|worker)
#
# As actions estão fixadas por SHA de commit (versão no comentário).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PRODUCT: helpnfse                                 # nome registrado em brskt-infra/apps/
  IMAGE: ghcr.io/${{ github.repository }}           # ex.: ghcr.io/brskt-dev/exemplo
  VPS: brskt-vps.tail61f559.ts.net
  # Credencial OIDC da Tailscale (Trust credentials), subject repo:brskt-dev@78738306/*:ref:refs/heads/main.
  # Identificadores públicos, não segredos: sem um token OIDC do GitHub de um job na main de um
  # repositório brskt-dev, não servem para nada.
  TS_CLIENT_ID: TFikuWCViH11CNTRL-k9P2cfddQB21CNTRL
  TS_AUDIENCE: api.tailscale.com/TFikuWCViH11CNTRL-k9P2cfddQB21CNTRL

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # PostgreSQL real para os testes de integração (fila, concorrência, recuperação).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: somente-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Testes do produto, antes de publicar a imagem (em containers: sem actions extras).
      - name: testes backend (.NET + PostgreSQL)
        run: |
          docker run --rm --network host -v "$PWD/backend:/src" -w /src \
            -e HELPNFSE_TEST_PG="Host=127.0.0.1;Port=5432;Username=postgres;Password=somente-ci;Database=postgres" \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0 dotnet test tests/HelpNfse.Tests
      - name: testes frontend (Angular + Vitest)
        run: |
          docker run --rm -v "$PWD/frontend:/web" -w /web node:22-alpine \
            sh -c "npm ci --no-audit --no-fund && npx ng test --watch=false"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'             # a credencial da Tailscale só aceita a main
    permissions:
      contents: read
      packages: read                                # o servidor puxa a imagem com o GITHUB_TOKEN
      id-token: write                               # token OIDC do GitHub para a Tailscale
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Entra na tailnet só durante o job, com a tag tag:ci; a ACL só libera brskt-vps:22.
      # Workload identity federation (OIDC): nenhum segredo da Tailscale fica no GitHub.
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:ci
      - name: deploy
        env:
          SSH_KEY: ${{ secrets.BRSKT_DEPLOY_SSH_KEY }}
          # Credencial efêmera para o servidor puxar a imagem privada do GHCR (vale só neste job).
          BRSKT_REGISTRY: ghcr.io
          BRSKT_REGISTRY_USER: ${{ github.actor }}
          BRSKT_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Variáveis do produto (opcional): secret APP_ENV com linhas KEY=VALUE.
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/brskt_deploy && chmod 600 ~/.ssh/brskt_deploy
          # Chave de host da VPS (docs/inventory.md, SHA256:q0vO2Z2weJAVJBI5y8Bs9tuWg12HVd4essM7FlnfTu4).
          # Nunca use StrictHostKeyChecking=no.
          echo "${VPS} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDgg6/OUKFbm3CWYuryQDd/NcRahG1dXwzL0+rmeVwXI" > ~/.ssh/known_hosts
          # -4: a ACL da tailnet libera só o IPv4 da VPS (alias brskt-vps); IPv6 ficaria em timeout.
          # APP_ENV é gravado antes do deploy (mescla: chaves fora dele continuam; remova com o ops).
          if [ -n "$APP_ENV" ]; then
            printf '%s\n' "$APP_ENV" | ssh -4 -i ~/.ssh/brskt_deploy -o BatchMode=yes "deploy@${VPS}" env-set
          fi
          ssh -4 -i ~/.ssh/brskt_deploy -o BatchMode=yes \
            -o SendEnv=BRSKT_REGISTRY -o SendEnv=BRSKT_REGISTRY_USER -o SendEnv=BRSKT_REGISTRY_TOKEN \
            "deploy@${VPS}" deploy "${{ needs.build.outputs.tag }}" < deploy/compose.yml
      - name: status
        if: always()
        run: ssh -4 -i ~/.ssh/brskt_deploy -o BatchMode=yes "deploy@${VPS}" status
