# help-nfse — deploy na infraestrutura BRSKT (contrato: brskt-infra/docs/deployment-guide.md).
# Validar antes de cada push que altere este arquivo:
#   ../brskt-infra/scripts/validate-compose.sh helpnfse deploy/compose.yml
#
# Uma imagem para tudo: API + frontend (helpnfse-web), worker e migrações.
# Banco: PostgreSQL compartilhado; ConnectionStrings__Default (usuário _app) e
# ConnectionStrings__Migrations (usuário _migrator) chegam pelo env_file do banco.
# Variáveis do app (Admin__Email, Admin__Senha, ...) chegam pelo secret APP_ENV do repositório.
name: app-helpnfse

services:
  helpnfse-web:
    image: ghcr.io/brskt-dev/help-nfse:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    cgroup_parent: brskt-apps.slice
    mem_limit: 384m
    memswap_limit: 384m
    mem_reservation: 128m
    cpu_shares: 1024
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    user: "1654:1654"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/brskt/secrets/apps/helpnfse.env
      - /etc/brskt/secrets/db/helpnfse.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Emissao__Provedor: Simulacao
      APP_VERSION: ${IMAGE_TAG}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - edge
      - db
    labels:
      traefik.enable: "true"
      traefik.http.routers.helpnfse-web.rule: Host(`helpnfse.brskt.dev`)
      traefik.http.routers.helpnfse-web.entrypoints: websecure
      traefik.http.routers.helpnfse-web.tls.certresolver: le
      traefik.http.routers.helpnfse-web.middlewares: hsts@file
      traefik.http.services.helpnfse-web.loadbalancer.server.port: "8080"

  # Fila de emissão (banco como fila). Sem tráfego de entrada.
  worker:
    image: ghcr.io/brskt-dev/help-nfse:${IMAGE_TAG}
    entrypoint: ["dotnet", "/app/worker/HelpNfse.Worker.dll"]
    working_dir: /app/worker
    restart: unless-stopped
    init: true
    cgroup_parent: brskt-batch.slice
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    user: "1654:1654"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 50s
    env_file:
      - /etc/brskt/secrets/apps/helpnfse.env
      - /etc/brskt/secrets/db/helpnfse.env
    environment:
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Emissao__Provedor: Simulacao
      # Identificador estável: após reinício, o worker reconcilia imediatamente o que deixou em andamento.
      Emissao__WorkerId: helpnfse-worker
      # Na VPS compartilhada, o cenário "Interromper o worker" simula a queda com uma falha em vez de matar
      # o processo; a recuperação acontece quando o bloqueio expira (padrão: 2 min).
      Simulacao__PermitirInterrupcaoReal: "false"
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/helpnfse-worker.alive) )) -lt 60"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - db
      - egress

  # Roda ANTES de subir a nova versão (brskt-deploy deploy); se falhar, nada muda no ar.
  migrate:
    image: ghcr.io/brskt-dev/help-nfse:${IMAGE_TAG}
    profiles:
      - migrate
    restart: "no"
    cgroup_parent: brskt-batch.slice
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    user: "1654:1654"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/brskt/secrets/db/helpnfse.env
    command: ["--migrate"]
    networks:
      - db

networks:
  edge:
    external: true
  db:
    external: true
    name: db_helpnfse
  egress: {}
